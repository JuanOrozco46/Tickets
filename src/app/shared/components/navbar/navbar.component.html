<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/dashboard" class="brand-link">
      <span class="brand-icon">🎫</span>
      <span class="brand-name">HelpDesk Tickets</span>
    </a>
  </div>

  <div class="navbar-menu" *ngIf="currentUser$ | async as user">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Dashboard</a>
    <a *ngIf="user.role === 'admin'" routerLink="/admin" routerLinkActive="active" class="nav-link">Administración</a>
  </div>

  <div class="navbar-user" *ngIf="currentUser$ | async as user">
    <div class="user-badge" [ngClass]="user.role">
      {{ user.role | uppercase }}
    </div>
    <span class="user-email">{{ user.name || user.email }}</span>
    <button class="btn-logout" (click)="logout()">
      <span>Cerrar Sesión</span>
    </button>
  </div>
</nav>
