<div class="auth-container">
    <div class="auth-card">
        <h2>Iniciar Sesión</h2>

        <div *ngIf="errorMessage" class="alert-error">
            {{ errorMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input id="email" type="email" formControlName="email" placeholder="ejemplo@helpdesk.dev">
                <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="field-error">
                    Ingrese un correo válido
                </small>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" formControlName="password">
                <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
                    class="field-error">
                    La contraseña es requerida
                </small>
            </div>

            <button type="submit" [disabled]="loginForm.invalid || loading">
                {{ loading ? 'Ingresando...' : 'Entrar' }}
            </button>
        </form>

        <div class="auth-footer">
            <span>¿No tienes cuenta?</span>
            <a routerLink="/auth/register">Regístrate aquí</a>
        </div>
    </div>
</div>
