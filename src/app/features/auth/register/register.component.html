<div class="auth-container">
  <div class="auth-card">
    <h2>Crear Cuenta</h2>

    <div *ngIf="errorMessage" class="alert-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input id="name" type="text" formControlName="name" placeholder="Nombre completo">
        <small *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid" class="field-error">
          El nombre es requerido
        </small>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" placeholder="ejemplo@helpdesk.dev">
        <small *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="field-error">
          Ingrese un correo válido
        </small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password">
        <small *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="field-error">
          La contraseña debe tener al menos 6 caracteres
        </small>
      </div>

      <button type="submit" [disabled]="registerForm.invalid || loading">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <div class="auth-footer">
      <span>¿Ya tienes cuenta?</span>
      <a routerLink="/auth/login">Inicia sesión aquí</a>
    </div>
  </div>
</div>
